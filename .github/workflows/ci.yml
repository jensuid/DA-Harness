# CI for DAH (P4-CI-007; the runner floor and the packaged-log smoke are
# P5-CI-004).
#
# Four jobs: the server suite plus its gates, the web suite plus a build, a
# sidecar packaging build, and the desktop shell's Rust tests - including the
# two live-core lifecycle tests - which consume the sidecar the packaging job
# built, because tauri-build will not compile without it.
#
# macOS only, on purpose. The Python engine's hard sandbox is macOS seatbelt
# (P3-SEC-001), the packaged app is a macOS .app, and the sidecar is a macOS
# PyInstaller build - running this elsewhere would test a platform DAH does
# not target and would skip the sandbox paths that most need exercising.
#
# Every job runs on macos-latest. The P5-CI-004 intent was to pin macos-13
# (Ventura) as the minimum supported version and to build on the last Intel
# runner, matching the development machine's x86_64-apple-darwin sidecar
# triple. That is not possible on hosted runners: GitHub retired the macos-13
# Intel pool, so a `runs-on: macos-13` job queues forever and never picks up a
# runner - verified empirically here, where a macos-latest probe job completed
# in under a minute while an identical macos-13 job sat queued with zero steps
# for 18 minutes. The Ventura floor remains the documented minimum supported
# macOS; CI builds on whatever macos-latest resolves to (Apple Silicon today),
# so a green run proves the code and the packaging path but NOT the exact
# Intel triple a local build produces. Restoring the Intel lane needs a
# self-hosted runner; see ai/DECISIONS.md.
#
# Hermeticity: no LLM credentials are ever set. Every assistant engine reads
# DAH_LLM_API_KEY at call time and degrades to its deterministic one, so the
# suite and both gates run fully offline with source=deterministic. The gates
# also scrub those variables from the pytest subprocesses they spawn.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv installs into a cache key shared across jobs; a stable python pin keeps
  # it reproducible.
  PYTHON_VERSION: "3.14"
  # NOTE: the runner is a literal `runs-on:` in each job below, never an env
  # reference. The `env` context is NOT available in `runs-on`, so an indirect
  # reference silently fails the whole workflow at parse time - every job,
  # zero seconds in, reported only as a "workflow file issue". That bug hid
  # for three commits; do not reintroduce the indirection.

jobs:
  # P5-CI-004 pinned the runner to macos-13 (Ventura / Intel) so a green run
  # would prove the exact triple the developer's machine and the published
  # artifacts use. GitHub retired that pool, so every job below runs on
  # macos-latest, which is Apple Silicon today. This job is the receipt: it
  # fails the run when the CI architecture is not the one the release ships,
  # rather than letting a green run read as proof of the shipped triple.
  # It is a `continue-on-error: false` job by design, so a reader of a green
  # run knows the mismatch was resolved and not ignored. Restore the Intel
  # lane (a self-hosted runner) and this job passes on its own.
  arch-mismatch:
    name: Verify the CI architecture matches the shipped artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the runner triple with the artifact's
        run: |
          # macos-latest resolves to arm64 on the hosted pool; the developer's
          # machine and every published DAH artifact are x86_64. This is a
          # warning the workflow cannot fix, only surface - the artifact is
          # built locally with ./bundle_dmg.sh from an Intel machine.
          echo "CI runner:  ${{ runner.arch }}  (hosted macos-latest pool)"
          echo "Shipped:    X64  (Intel, built locally and published by hand)"
          if [ "${{ runner.arch }}" != "X64" ]; then
            echo "::warning::CI builds and tests on ${{ runner.arch }}, but the released artifact is X64. A green run proves the code and the packaging path, not the shipped triple. The release is built locally from an Intel machine."
          fi

  server:
    name: Server suite + gates
    runs-on: macos-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the virtualenv
        run: uv venv .venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # dev (pytest, httpx) and charts (pillow, for the raster backend).
        # The gates and the suite need both.
        run: uv pip install --python .venv/bin/python -e ".[dev,charts]"

      - name: Run the suite
        run: .venv/bin/python -m pytest -q

      - name: P2 gate
        # The scripts live at the repo root, not under server/.
        run: .venv/bin/python ../verification/p2/verify_p2.py

      - name: P3 gate
        run: .venv/bin/python ../verification/p3/verify_p3.py

      - name: P4 gate
        # The P4 journey walks the edges, not the happy path: bad input, a
        # harness fault, a broken LLM, rerun determinism, the result cap.
        run: .venv/bin/python ../verification/p4/verify_p4.py

      - name: End-to-end against a real server
        # The gates drive the app in-process; this one starts a real uvicorn
        # server on a free port and drives the whole journey over HTTP, so the
        # port binding, the multipart upload and the server lifecycle are
        # exercised too. Deterministic: the LLM env vars are emptied for the
        # server's subprocess, so no network call is made.
        run: .venv/bin/python ../verification/e2e/verify_e2e.py

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            verification/p2/REPORT.md
            verification/p3/REPORT.md
            verification/p4/REPORT.md
            verification/e2e/REPORT.md

  web:
    name: Web suite + build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the suite
        run: npm test

      - name: Build the browser bundle
        # A typecheck + build, not just a bundling pass: tsc -b runs first, so
        # a type error the jsdom tests can't see still fails CI.
        run: npm run build

  desktop:
    name: Desktop shell lifecycle
    runs-on: macos-latest
    needs: packaging
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the sidecar built by the packaging job
        # tauri-build refuses to compile without the externalBin resource
        # present, so the shell cannot be tested - not even its pure unit
        # tests - until this lands in binaries/.
        uses: actions/download-artifact@v4
        with:
          name: sidecar
          path: desktop/src-tauri/binaries

      - name: Restore the sidecar's executable bit
        # The artifact transport preserves contents but not permissions, and
        # spawn() needs +x. The tests assert a real packaged binary works, so
        # this restores what the transfer lost rather than making the test
        # tolerant of a binary it could not run.
        run: chmod +x desktop/src-tauri/binaries/dah-core-*

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the server virtualenv
        # The dev-path e2e test resolves server/.venv/bin/python and spawns
        # uvicorn from it, so the venv must be at that exact path.
        working-directory: server
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          uv pip install --python .venv/bin/python -e ".[dev,charts]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the desktop web bundle
        # tauri::generate_context!() embeds web/dist-desktop at compile time,
        # so cargo test cannot build the shell without it - the path exists on
        # a developer's machine and nowhere else.
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build:desktop

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Unit tests (no live core)
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Lifecycle tests against a live core
        # --features e2e spawns the real uvicorn and waits on /health, then
        # asserts the core is stopped and the port is freed afterwards.
        working-directory: desktop/src-tauri
        run: cargo test --features e2e

  packaging:
    name: Sidecar build
    runs-on: macos-latest
    # The sidecar is a release artifact, not a test. Building it in CI proves
    # the packaging path still works on a clean machine - locally it is easy to
    # carry a stale build and never notice a regression in the spec.
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the virtualenv
        run: uv venv .venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies including PyInstaller
        run: uv pip install --python .venv/bin/python -e ".[dev,charts,packaging]"

      - name: Install Rust toolchain
        # build_sidecar.sh derives the target triple from `rustc -vV` - the
        # macOS runners do not ship a Rust toolchain, so without this the
        # triple comes out empty and the artifact lands under the wrong name.
        uses: dtolnay/rust-toolchain@stable

      - name: Build the sidecar
        run: ./build_sidecar.sh

      - name: Upload the sidecar
        # The desktop job cannot compile without it: tauri-build validates the
        # externalBin resource at build time, so cargo test fails outright when
        # the binary is absent. Passing it along also lets the orphan test run
        # in CI instead of skipping.
        uses: actions/upload-artifact@v4
        with:
          name: sidecar
          path: desktop/src-tauri/binaries/dah-core-*
          if-no-files-found: error
          retention-days: 1

      - name: Smoke the packaged core
        # The binary must actually serve, not merely build - and its logs must
        # land where a packaged app's logs belong. The packaged core's stderr is
        # a pipe nothing reads, so the log file is the only place a fault leaves
        # a trace (P5-OBSERVE-002); checking it here proves that in the real
        # PyInstaller bundle rather than in a dev checkout.
        run: |
          BINARY="$(rustc -vV | awk '/^host:/ {print $2}')"
          # This step runs from server/, so the artifact is one level up.
          ARTIFACT="../desktop/src-tauri/binaries/dah-core-${BINARY}"
          test -x "$ARTIFACT" || { echo "missing $ARTIFACT"; exit 1; }
          DATA="$(mktemp -d)"
          DAH_DATA_DIR="$DATA" DAH_DB_PATH="$DATA/dah.db" \
            "$ARTIFACT" --port 8124 &
          CORE_PID=$!
          for _ in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8124/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8124/health
          # The packaged core has to know its own version: `/updates/latest`
          # compares it against the release feed, and a bundle that answers
          # `unknown` can never compare. The spec stamps the version into the
          # bundle from pyproject, so this is the same number the tag was cut
          # from - and a bundle built without the stamp fails here rather than
          # shipping a Check for Updates item that cannot work.
          VERSION="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          UPDATES="$(curl -fsS http://127.0.0.1:8124/updates/latest)"
          echo "$UPDATES"
          echo "$UPDATES" | grep -qF "\"current\":\"$VERSION\"" || \
            { echo "the packaged core reports a version other than $VERSION"; \
              exit 1; }
          # File logging has to be on in the packaged core, and the log has to
          # be under the data dir the shell sets - not next to the binary,
          # which a user cannot read inside an .app bundle.
          LOGS="$(curl -fsS http://127.0.0.1:8124/logs)"
          echo "$LOGS" | grep -q '"enabled":true' || \
            { echo "file logging is off in the packaged core"; echo "$LOGS"; exit 1; }
          echo "$LOGS" | grep -qF "$DATA/logs/dah-core.log" || \
            { echo "the packaged core is not logging into its data dir"; echo "$LOGS"; exit 1; }
          # Deliberately a plain kill, not the group signal the shell uses: a
          # non-interactive shell keeps background jobs in its own process
          # group, so a negative PID would take the runner's shell down with
          # the core. Orphaning the bootloader child does not matter here -
          # the VM is destroyed the moment the job ends, unlike a user's
          # machine where it would hold the port past launch.
          kill "$CORE_PID"
          wait "$CORE_PID" 2>/dev/null || true
