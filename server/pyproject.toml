[project]
name = "dah-server"
version = "0.1.0"
description = "Data Analysis Harness - deterministic core (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.18",
    "duckdb>=1.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
charts = [
    "pillow>=10",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# The PyInstaller one-file sidecar the desktop shell spawns. Not needed to run
# the server or its tests - only to produce a distributable app.
packaging = [
    "pyinstaller>=6",
]

[tool.setuptools]
# Flat-layout discovery sees `app` and `tests` as competing top-level packages
# and fails on a clean checkout (a stale egg-info masks it locally). `app` is
# the only importable package; the test suite is collected by pytest, not
# installed.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
