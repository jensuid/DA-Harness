[project]
name = "dah-server"
version = "0.1.0"
description = "Data Analysis Harness - deterministic core (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.18",
    "duckdb>=1.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
charts = [
    "pillow>=10",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
